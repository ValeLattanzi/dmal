<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMAL - Decentralized Music Academy Ledger</title>
    <!-- Tailwind CSS para el diseño premium -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
                    },
                    animation: {
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'spin-slow': 'spin 3s linear infinite',
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Estilos Personalizados (Efectos Holográficos y Glassmorphism) -->
    <style type="text/css">
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .glass {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .hologram-card {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(99, 102, 241, 0.1) 50%, rgba(6, 182, 212, 0.1) 100%);
            border: 1px solid rgba(16, 185, 129, 0.2);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.05);
            position: relative;
            overflow: hidden;
        }
        .hologram-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 45%,
                rgba(255, 255, 255, 0.1) 50%,
                transparent 55%
            );
            transform: rotate(45deg);
            transition: transform 0.5s ease;
            animation: holoShift 6s ease-in-out infinite alternate;
        }
        @keyframes holoShift {
            0% { transform: translate(-30%, -30%) rotate(25deg); }
            100% { transform: translate(30%, 30%) rotate(25deg); }
        }
        /* Custom scrollbar para consolas */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #020617;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>
<body class="h-full text-slate-100">
    <div id="root" class="min-h-full flex flex-col"></div>

    <!-- Script del MVP en React -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICONOS SVG EN LÍNEA PARA EVITAR DEPENDENCIAS ---
        const Icons = {
            Shield: () => (
                <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
            ),
            BookOpen: () => (
                <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
            ),
            Music: () => (
                <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/></svg>
            ),
            Award: () => (
                <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
            ),
            HardDrive: () => (
                <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
            ),
            Clock: () => (
                <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            ),
            CheckCircle: () => (
                <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            ),
            Key: () => (
                <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15 7a2 2 0 012 2m-5 4a3.3 3.3 0 000-4.6l-8-8H2v2h2v2h2v2h2v2l2 2m4 0a5 5 0 10.1-1.3"/></svg>
            ),
            User: () => (
                <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            )
        };

        function App() {
            // --- ESTADO GLOBAL SIMULADO ---
            const [currentRole, setCurrentRole] = useState(() => localStorage.getItem('dmal_role') || 'professor');
            
            // Simulación de Base de Datos Local (PostgreSQL de la tesis)
            const [dbRecords, setDbRecords] = useState(() => {
                const saved = localStorage.getItem('dmal_db_records');
                return saved ? JSON.parse(saved) : [
                    { student: '0xValentinoLattanzi77764DDR5LianLiIII', subjectId: '101', subjectName: 'Composición Musical I', score: 92, approved: true, date: '2026-05-10', professorId: 14, status: 'CONFIRMED' }
                ];
            });

            // Registro de Propiedad Intelectual
            const [compositions, setCompositions] = useState(() => {
                const saved = localStorage.getItem('dmal_compositions');
                return saved ? JSON.parse(saved) : [
                    { id: 1, title: 'Sonata para Piano en Sol Menor', ipfsHash: 'QmXoypizjW3WknFixtndV3VCVUWB7F16mdA9nz28bce85S', author: '0xValentinoLattanzi77764DDR5LianLiIII', timestamp: '2026-05-15 14:32', isRegular: true }
                ];
            });

            // Log de Transacciones / Mempool para el Ledger Lateral
            const [transactions, setTransactions] = useState(() => {
                const saved = localStorage.getItem('dmal_txs');
                return saved ? JSON.parse(saved) : [
                    { id: 1, type: 'Carga de Nota', detail: 'Composición Musical I: 92', status: 'CONFIRMED', txHash: '0x3ac912fa...e93d', block: 18492019 },
                    { id: 2, type: 'Registro IP', detail: 'Sonata para Piano en Sol Menor (IPFS)', status: 'CONFIRMED', txHash: '0x5b8a11bc...48fa', block: 18492020 }
                ];
            });

            // Logs de ejecución simulados del Backend de Java (Spring Boot)
            const [springLogs, setSpringLogs] = useState([
                '[INFO] 2026-05-31 14:40:12 - Application - Starting DMAL Spring Boot Engine on localhost:8080...',
                '[INFO] 2026-05-31 14:40:15 - BlockchainService - Web3j connection established with local EVM (Hardhat Node).',
                '[INFO] 2026-05-31 14:40:15 - BlockchainService - Contract ConservatoryAcademy loaded at address: 0x8fC820...4Fa1'
            ]);

            // Variables de entorno de la Blockchain Simulada
            const [blockHeight, setBlockHeight] = useState(18492020);
            const [walletAddress, setWalletAddress] = useState('0xValentinoLattanzi77764DDR5LianLiIII');
            const [isSbtRevoked, setIsSbtRevoked] = useState(false);
            const [reissuedWallet, setReissuedWallet] = useState('');

            // Formularios
            const [scoreInput, setScoreInput] = useState('');
            const [selectedSubject, setSelectedSubject] = useState('102');
            const [compTitle, setCompTitle] = useState('');
            const [isProcessing, setIsProcessing] = useState(false);
            const [toastMessage, setToastMessage] = useState(null);

            // Ref para auto-scroll de logs de Spring Boot
            const logConsoleRef = useRef(null);

            const subjectsMap = {
                '101': 'Composición Musical I',
                '102': 'Contrapunto Avanzado',
                '103': 'Audioperceptiva V'
            };

            // Efecto para simular el avance de bloques de la red
            useEffect(() => {
                const interval = setInterval(() => {
                    setBlockHeight(h => h + 1);
                    addLog(`[INFO] EVM Node - New block mined: #${blockHeight + 1} (Gas limit verified, transactions packing)`);
                }, 12000);
                return () => clearInterval(interval);
            }, [blockHeight]);

            // Guardar estados locales
            useEffect(() => {
                localStorage.setItem('dmal_role', currentRole);
            }, [currentRole]);

            useEffect(() => {
                localStorage.setItem('dmal_db_records', JSON.stringify(dbRecords));
            }, [dbRecords]);

            useEffect(() => {
                localStorage.setItem('dmal_compositions', JSON.stringify(compositions));
            }, [compositions]);

            useEffect(() => {
                localStorage.setItem('dmal_txs', JSON.stringify(transactions));
            }, [transactions]);

            useEffect(() => {
                if (logConsoleRef.current) {
                    logConsoleRef.current.scrollTop = logConsoleRef.current.scrollHeight;
                }
            }, [springLogs]);

            // Auxiliar para añadir logs a la consola de Spring Boot
            const addLog = (msg) => {
                const time = new Date().toISOString().replace('T', ' ').substring(0, 19);
                setSpringLogs(prev => [...prev, `[INFO] ${time} - ${msg}`]);
            };

            const showToast = (message, type = 'info') => {
                setToastMessage({ message, type });
                setTimeout(() => setToastMessage(null), 4000);
            };

            // --- FLUX DE NEGOCIO: ENVIAR EXAMEN (DOCENTE) ---
            const handleGradeSubmit = (e) => {
                e.preventDefault();
                if (!scoreInput || isProcessing) return;

                const scoreVal = parseInt(scoreInput);
                if (scoreVal < 0 || scoreVal > 100) {
                    showToast('La nota debe estar entre 0 y 100', 'error');
                    return;
                }

                setIsProcessing(true);
                const txHash = '0x' + Array.from({length: 40}, () => Math.floor(Math.random()*16).toString(16)).join('');
                const shortTx = txHash.substring(0, 10) + '...' + txHash.substring(36);

                // 1. Accionamiento asíncrono inmediata en Java (Spring Boot envia 202 Accepted)
                addLog(`REST - POST /api/v1/academic/grades - Received request for student ${walletAddress.substring(0,12)}...`);
                addLog(`BlockchainService - Initiating EVM Transaction for submitGrade(...) with credentials KMS_DOCENTE_14`);

                const tempTxId = Date.now();
                const newTx = {
                    id: tempTxId,
                    type: 'Carga de Nota',
                    detail: `${subjectsMap[selectedSubject]}: ${scoreVal}`,
                    status: 'PENDING_ON_CHAIN',
                    txHash: shortTx,
                    block: 'Pendiente...'
                };
                setTransactions(prev => [newTx, ...prev]);

                // Añadimos a la base de datos PostgreSQL local como "PENDIENTE" de confirmación on-chain
                const newDbRecord = {
                    student: walletAddress,
                    subjectId: selectedSubject,
                    subjectName: subjectsMap[selectedSubject],
                    score: scoreVal,
                    approved: scoreVal >= 60,
                    date: new Date().toISOString().split('T')[0],
                    professorId: 14,
                    status: 'PENDING'
                };
                setDbRecords(prev => [...prev, newDbRecord]);

                showToast('Spring Boot: Transacción 202 Aceptada. Procesando en la EVM...', 'success');

                // 2. Simulación de minado de bloque en EVM (Consistencia Eventual)
                setTimeout(() => {
                    const currentBlock = blockHeight + 1;
                    
                    // Actualizamos Ledger
                    setTransactions(prev => 
                        prev.map(t => t.id === tempTxId ? { ...t, status: 'CONFIRMED', block: currentBlock } : t)
                    );

                    // Confirmamos en PostgreSQL local (Web2) gatillado por el "Event Listener"
                    setDbRecords(prev => 
                        prev.map(r => r.student === walletAddress && r.subjectId === selectedSubject ? { ...r, status: 'CONFIRMED' } : r)
                    );

                    addLog(`Event Listener - Caught event 'SubjectApproved' in block #${currentBlock}. Synchronization in PostgreSQL database triggered!`);
                    addLog(`PostgreSQL - Student record for ${walletAddress.substring(0,10)}... updated status from PENDING to CONFIRMED.`);

                    setIsProcessing(false);
                    setScoreInput('');
                    showToast('✔️ Transacción confirmada on-chain y base de datos local sincronizada.', 'confirmed');
                }, 4000);
            };

            // --- FLUX DE NEGOCIO: REGISTRAR COMPOSICIÓN (ALUMNO) ---
            const handleRegisterComposition = (e) => {
                e.preventDefault();
                if (!compTitle || isProcessing) return;

                setIsProcessing(true);
                const txHash = '0x' + Array.from({length: 40}, () => Math.floor(Math.random()*16).toString(16)).join('');
                const shortTx = txHash.substring(0, 10) + '...' + txHash.substring(36);
                
                // Simulación de cálculo local SHA-256 para IPFS
                const simulatedIpfsCID = 'Qm' + Array.from({length: 44}, () => "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"[Math.floor(Math.random()*62)]).join('');

                addLog(`REST - POST /api/v1/ip/compositions - Received file metadata.`);
                addLog(`CompositionRegistry - Executing cross-contract query to ConservatoryAcademy.sol: verifyStudentStatus(${walletAddress.substring(0,10)}...)`);

                // Check cross-contract: ¿Es alumno regular (tiene alguna nota aprobada registrada)?
                const isRegular = dbRecords.some(r => r.student === walletAddress && r.approved && r.status === 'CONFIRMED');
                
                const tempTxId = Date.now();
                const newTx = {
                    id: tempTxId,
                    type: 'Registro IP',
                    detail: `IPFS: ${compTitle}`,
                    status: 'PENDING_ON_CHAIN',
                    txHash: shortTx,
                    block: 'Pendiente...'
                };
                setTransactions(prev => [newTx, ...prev]);

                showToast(`EVM: Cross-Contract Check exitoso. Tarifa: ${isRegular ? '0 ETH (Regular)' : '0.05 ETH (Externo)'}`, 'success');

                setTimeout(() => {
                    const currentBlock = blockHeight + 1;

                    // Actualizar transacciones
                    setTransactions(prev => 
                        prev.map(t => t.id === tempTxId ? { ...t, status: 'CONFIRMED', block: currentBlock } : t)
                    );

                    // Insertar composición
                    setCompositions(prev => [
                        {
                            id: prev.length + 1,
                            title: compTitle,
                            ipfsHash: simulatedIpfsCID,
                            author: walletAddress,
                            timestamp: new Date().toISOString().replace('T', ' ').substring(0, 16),
                            isRegular: isRegular
                        },
                        ...prev
                    ]);

                    addLog(`Event Listener - Captured 'CompositionRegistered' on EVM. Mapping populated: author => CID`);
                    setIsProcessing(false);
                    setCompTitle('');
                    showToast('✔️ Propiedad intelectual grabada permanentemente en la EVM.', 'confirmed');
                }, 4000);
            };

            // --- RECUPERACIÓN / REEMISIÓN DE CREDENCIALES (ADMIN PANEL) ---
            const handleAdminReissue = (e) => {
                e.preventDefault();
                if (!reissuedWallet.startsWith('0x') || reissuedWallet.length < 15) {
                    showToast('Por favor introduce una dirección hexadecimal de wallet válida.', 'error');
                    return;
                }

                addLog(`ADMIN ACTION - Emergency SBT revocation triggered for old wallet: ${walletAddress.substring(0,10)}...`);
                addLog(`KMS Signer - Dispatching burn() for SBT #9921 on token contract...`);

                setIsSbtRevoked(true);
                setWalletAddress(reissuedWallet);

                // Migrar registros históricos on-chain a la nueva clave
                setDbRecords(prev => prev.map(r => ({ ...r, student: reissuedWallet })));
                setCompositions(prev => prev.map(c => ({ ...c, author: reissuedWallet })));
                
                addLog(`KMS Signer - Dispatching mint() of reissued SBT to: ${reissuedWallet.substring(0,10)}...`);
                showToast('🚨 SBT Revocado. Historial de analíticos migrado de forma segura a la nueva wallet.', 'error');
                setReissuedWallet('');
            };

            const clearHistory = () => {
                localStorage.clear();
                setDbRecords([
                    { student: '0xValentinoLattanzi77764DDR5LianLiIII', subjectId: '101', subjectName: 'Composición Musical I', score: 92, approved: true, date: '2026-05-10', professorId: 14, status: 'CONFIRMED' }
                ]);
                setCompositions([
                    { id: 1, title: 'Sonata para Piano en Sol Menor', ipfsHash: 'QmXoypizjW3WknFixtndV3VCVUWB7F16mdA9nz28bce85S', author: '0xValentinoLattanzi77764DDR5LianLiIII', timestamp: '2026-05-15 14:32', isRegular: true }
                ]);
                setTransactions([]);
                setIsSbtRevoked(false);
                setWalletAddress('0xValentinoLattanzi77764DDR5LianLiIII');
                showToast('Historial local reiniciado.', 'info');
            };

            return (
                <div className="flex-1 flex flex-col">
                    
                    {/* ─── TOAST NOTIFICATIONS ─── */}
                    {toastMessage && (
                        <div className="fixed bottom-6 right-6 z-50 animate-bounce">
                            <div className={`px-6 py-4 rounded-xl border shadow-2xl flex items-center gap-3 text-sm font-semibold ${
                                toastMessage.type === 'success' ? 'bg-indigo-950/90 border-indigo-500/50 text-indigo-300' :
                                toastMessage.type === 'confirmed' ? 'bg-emerald-950/90 border-emerald-500/50 text-emerald-300' :
                                toastMessage.type === 'error' ? 'bg-red-950/90 border-red-500/50 text-red-300' :
                                'bg-slate-900/90 border-slate-700 text-slate-300'
                            }`}>
                                <div className="w-2 h-2 rounded-full bg-current animate-pulse"></div>
                                <span>{toastMessage.message}</span>
                            </div>
                        </div>
                    )}

                    {/* ─── ENTORNO DE CONTROL SUPERIOR (HEADER) ─── */}
                    <header className="border-b border-slate-800 bg-slate-900/40 backdrop-blur sticky top-0 z-40 px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div className="flex items-center gap-3">
                            <div className="p-2.5 bg-gradient-to-tr from-indigo-600 to-cyan-500 rounded-xl text-white shadow-lg shadow-indigo-500/10">
                                <Icons.Shield />
                            </div>
                            <div>
                                <div className="flex items-center gap-2">
                                    <h1 className="font-extrabold text-xl tracking-wider bg-gradient-to-r from-indigo-400 via-cyan-400 to-emerald-400 bg-clip-text text-transparent">
                                        DMAL PLATFORM
                                    </h1>
                                    <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 tracking-wider">
                                        PROTOTIPO DE TESIS
                                    </span>
                                </div>
                                <p className="text-xs text-slate-400">Decentralized Music Academy Ledger &middot; UTN ISI</p>
                            </div>
                        </div>

                        {/* SELECTOR DE ROL + NODO BLOCKCHAIN */}
                        <div className="flex flex-wrap items-center gap-4 w-full md:w-auto justify-end">
                            {/* EVM Status widget */}
                            <div className="hidden lg:flex items-center gap-3 bg-slate-950/80 px-4 py-2 rounded-xl border border-slate-850 font-mono text-xs">
                                <div className="flex items-center gap-2">
                                    <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                    <span className="text-slate-400">Node:</span>
                                    <span className="text-emerald-400 font-bold">Sepolia (Local)</span>
                                </div>
                                <div className="h-4 w-[1px] bg-slate-800"></div>
                                <div>
                                    <span className="text-slate-400">Block:</span>
                                    <span className="text-slate-200 font-bold ml-1">#{blockHeight}</span>
                                </div>
                            </div>

                            {/* Selector */}
                            <div className="flex items-center gap-2 bg-slate-950 p-1.5 rounded-xl border border-slate-800 w-full sm:w-auto">
                                <span className="text-xs text-slate-500 font-medium px-2 hidden sm:flex items-center gap-1">
                                    <Icons.User /> Rol:
                                </span>
                                <select 
                                    value={currentRole} 
                                    onChange={(e) => {
                                        setCurrentRole(e.target.value);
                                        addLog(`Interface - Context switched to [${e.target.value.toUpperCase()}]`);
                                    }}
                                    className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm font-bold py-2 px-4 rounded-lg border-none focus:ring-2 focus:ring-indigo-400 cursor-pointer outline-none transition-all w-full sm:w-auto"
                                >
                                    <option value="professor">👨‍🏫 Portal Docente (Notas)</option>
                                    <option value="student">🎼 Portal Alumno (IPFS / IP)</option>
                                    <option value="validator">🔍 Validador Público (SBT)</option>
                                    <option value="admin">⚙️ Administración / Recuperación</option>
                                </select>
                            </div>
                        </div>
                    </header>

                    {/* ─── CONTENIDO INTERACTIVO PRINCIPAL ─── */}
                    <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
                        
                        {/* COLUMNA COMPONENTES IZQUIERDA Y CENTRAL */}
                        <div className="lg:col-span-2 space-y-6">
                            
                            {/* INFO DE BIENVENIDA DINÁMICA POR ROL */}
                            <div className="glass rounded-2xl p-6 border border-slate-850 relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-4 opacity-5 pointer-events-none">
                                    <Icons.Shield />
                                </div>
                                <span className="text-xs font-bold text-indigo-400 tracking-wider uppercase mb-1 block">Contexto Operacional</span>
                                {currentRole === 'professor' && (
                                    <div>
                                        <h2 className="text-xl font-extrabold text-slate-100">Firma Criptográfica de Notas Académicas</h2>
                                        <p className="text-sm text-slate-400 mt-2">
                                            Como docente, tenés la firma delegada en tu clave privada. Cada nota cargada se agrupa en una estructura optimizada de 9 bytes (Storage Packing) para ahorrar gas. El backend responde inmediatamente (Web2) y sincroniza con el evento EVM (Web3).
                                        </p>
                                    </div>
                                )}
                                {currentRole === 'student' && (
                                    <div>
                                        <h2 className="text-xl font-extrabold text-slate-100">Depósito Inmutable de Propiedad Intelectual</h2>
                                        <p className="text-sm text-slate-400 mt-2">
                                            Como alumno regular del conservatorio, podés registrar tus composiciones (hashes de IPFS). El contrato <code className="text-cyan-400 bg-slate-900 px-1 py-0.5 rounded text-xs font-mono">CompositionRegistry.sol</code> ejecuta una consulta cross-contract al núcleo académico para verificar tu regularidad académica y eximirte del fee institucional.
                                        </p>
                                    </div>
                                )}
                                {currentRole === 'validator' && (
                                    <div>
                                        <h2 className="text-xl font-extrabold text-slate-100">Verificador Internacional de Credenciales</h2>
                                        <p className="text-sm text-slate-400 mt-2">
                                            Sin intermediarios, demorados trámites de legalización ni burocracia. Cualquier universidad del mundo puede auditar de forma descentralizada el analítico académico inalterable y las obras intelectuales verificando los Soulbound Tokens (SBT) del graduado.
                                        </p>
                                    </div>
                                )}
                                {currentRole === 'admin' && (
                                    <div>
                                        <h2 className="text-xl font-extrabold text-slate-100">Consola de Contingencia Administrativa</h2>
                                        <p className="text-sm text-slate-400 mt-2">
                                            Módulo de recuperación de emergencia de tokens SBT. Permite solucionar la vulnerabilidad de pérdida de clave privada del alumno mediante un esquema de quemado y reemisión institucional, garantizando la continuidad de su historial sin comprometer la seguridad.
                                        </p>
                                    </div>
                                )}
                            </div>

                            {/* PANTALLAS INTERACTIVAS */}
                            
                            {/* 👨‍🏫 PORTAL DOCENTE (CARGA DE NOTAS) */}
                            {currentRole === 'professor' && (
                                <div className="glass rounded-2xl p-6 border border-slate-850 shadow-xl space-y-6">
                                    <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                                        <div className="flex items-center gap-2 text-indigo-400">
                                            <Icons.BookOpen />
                                            <h3 className="font-bold text-lg">Carga de Notas Analíticas</h3>
                                        </div>
                                        <span className="text-xs bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-2.5 py-1 rounded-full font-mono">
                                            Gas Limit: 3,000,000
                                        </span>
                                    </div>

                                    <form onSubmit={handleGradeSubmit} className="space-y-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Dirección Wallet de Destino (Alumno)</label>
                                            <input 
                                                type="text" 
                                                readOnly 
                                                value={walletAddress} 
                                                className="w-full bg-slate-950 border border-slate-850 rounded-xl px-4 py-3 text-sm text-indigo-300 font-mono focus:outline-none cursor-not-allowed" 
                                            />
                                            <span className="text-[10px] text-slate-500 mt-1.5 block">Esta dirección de wallet representa la identidad soberana del alumno de forma permanente en la red.</span>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Asignatura / Cátedra</label>
                                                <select 
                                                    value={selectedSubject} 
                                                    onChange={(e) => setSelectedSubject(e.target.value)}
                                                    className="w-full bg-slate-950 border border-slate-850 rounded-xl px-4 py-3 text-sm text-slate-200 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all"
                                                >
                                                    <option value="101">Composición Musical I</option>
                                                    <option value="102">Contrapunto Avanzado</option>
                                                    <option value="103">Audioperceptiva V</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Calificación del Examen (0 - 100)</label>
                                                <input 
                                                    type="number" 
                                                    min="0" 
                                                    max="100"
                                                    value={scoreInput} 
                                                    onChange={(e) => setScoreInput(e.target.value)}
                                                    placeholder="Ej: 95" 
                                                    className="w-full bg-slate-950 border border-slate-850 rounded-xl px-4 py-3 text-sm text-slate-200 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all font-mono" 
                                                    required
                                                />
                                            </div>
                                        </div>

                                        {/* OPTIMIZACIÓN DE MEMORIA VISUAL */}
                                        <div className="bg-slate-950/60 p-4 rounded-xl border border-slate-850 space-y-3 font-mono text-xs">
                                            <span className="text-[10px] text-slate-500 uppercase font-bold tracking-wider">Gas Packing Optimizado (9 Bytes Struct - 1 Slot de EVM)</span>
                                            <div className="grid grid-cols-5 gap-1 text-center font-bold text-[10px] text-slate-400">
                                                <div className="p-1.5 bg-indigo-500/10 border border-indigo-500/20 rounded">score<br/><span className="text-indigo-400 text-[9px] font-normal">uint8 (1b)</span></div>
                                                <div className="p-1.5 bg-indigo-500/10 border border-indigo-500/20 rounded">attempts<br/><span className="text-indigo-400 text-[9px] font-normal">uint8 (1b)</span></div>
                                                <div className="p-1.5 bg-indigo-500/10 border border-indigo-500/20 rounded col-span-2">approvalDate<br/><span className="text-indigo-400 text-[9px] font-normal">uint32 (4b)</span></div>
                                                <div className="p-1.5 bg-indigo-500/10 border border-indigo-500/20 rounded">profId<br/><span className="text-indigo-400 text-[9px] font-normal">uint16 (2b)</span></div>
                                            </div>
                                        </div>

                                        <button 
                                            type="submit" 
                                            disabled={isProcessing}
                                            className="w-full bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-800 disabled:text-slate-500 text-white font-bold py-3.5 px-4 rounded-xl transition-all shadow-lg shadow-indigo-600/15 flex justify-center items-center gap-2 text-sm"
                                        >
                                            {isProcessing ? (
                                                <>
                                                    <span className="w-4 h-4 border-2 border-indigo-300 border-t-transparent rounded-full animate-spin"></span>
                                                    Firmando Nota & Minando en Blockchain...
                                                </>
                                            ) : 'Firmar y Cargar Acta Académica'}
                                        </button>
                                    </form>
                                </div>
                            )}

                            {/* 🎼 PORTAL ALUMNO (REGISTRO PROPIEDAD INTELECTUAL) */}
                            {currentRole === 'student' && (
                                <div className="glass rounded-2xl p-6 border border-slate-850 shadow-xl space-y-6">
                                    <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                                        <div className="flex items-center gap-2 text-cyan-400">
                                            <Icons.Music />
                                            <h3 className="font-bold text-lg">Prueba de Existencia Intelectual (IP)</h3>
                                        </div>
                                        <span className="text-xs bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 px-2.5 py-1 rounded-full font-mono">
                                            Interface: IPFS Registry
                                        </span>
                                    </div>

                                    <form onSubmit={handleRegisterComposition} className="space-y-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Título de la Obra / Partitura</label>
                                            <input 
                                                type="text" 
                                                value={compTitle}
                                                onChange={(e) => setCompTitle(e.target.value)}
                                                placeholder="Ej: Fantasía para Cello y Piano en Mi Menor" 
                                                className="w-full bg-slate-950 border border-slate-850 rounded-xl px-4 py-3 text-sm text-slate-200 outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all" 
                                                required
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Carga de Partitura o Grabación de Audio</label>
                                            <div className="border border-dashed border-slate-800 bg-slate-950 rounded-xl p-5 text-center">
                                                <div className="w-10 h-10 bg-cyan-500/10 text-cyan-400 rounded-full flex items-center justify-center mx-auto mb-2 border border-cyan-500/20">
                                                    <Icons.Music />
                                                </div>
                                                <span className="text-xs text-slate-400 font-semibold block">archivo_partitura_final.pdf</span>
                                                <span className="text-[10px] text-slate-600 font-mono mt-1 block">Generado hash criptográfico SHA-256 local para IPFS de forma inmutable</span>
                                            </div>
                                        </div>

                                        {/* CARD DE BENEFICIO CROSS-CONTRACT */}
                                        <div className="p-4 bg-cyan-950/20 border border-cyan-900/40 rounded-xl text-xs space-y-2">
                                            <div className="flex items-center gap-2 text-cyan-400 font-semibold">
                                                <Icons.CheckCircle />
                                                <span>Consulta Cross-Contract Verificada</span>
                                            </div>
                                            <p className="text-slate-400 leading-relaxed">
                                                El contrato inteligente verificó tu estado regular en <code className="text-cyan-300 font-mono">ConservatoryAcademy.sol</code>. Se omitirá el cobro de la tasa externa de <strong>0.05 ETH</strong>. El registro institucional es totalmente bonificado.
                                            </p>
                                        </div>

                                        <button 
                                            type="submit" 
                                            disabled={isProcessing}
                                            className="w-full bg-cyan-600 hover:bg-cyan-500 disabled:bg-slate-800 disabled:text-slate-500 text-slate-950 font-bold py-3.5 px-4 rounded-xl transition-all shadow-lg shadow-cyan-600/10 flex justify-center items-center gap-2 text-sm"
                                        >
                                            {isProcessing ? (
                                                <>
                                                    <span className="w-4 h-4 border-2 border-slate-950 border-t-transparent rounded-full animate-spin"></span>
                                                    Firmando & Creando Registro Temporal...
                                                </>
                                            ) : 'Registrar Propiedad Intelectual de la Obra'}
                                        </button>
                                    </form>
                                </div>
                            )}

                            {/* 🔍 PORTAL VERIFICADOR (SOULBOUND TOKENS / DIPLOMAS) */}
                            {currentRole === 'validator' && (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {/* DIPLOMA SOULBOUND TOKEN VISUAL */}
                                    <div className="hologram-card rounded-3xl p-6 border flex flex-col justify-between relative min-h-[380px] text-slate-100">
                                        <div className="absolute top-0 right-0 bg-emerald-500/20 text-emerald-300 text-[9px] font-bold px-4 py-1.5 rounded-bl-xl border-l border-b border-emerald-500/30 tracking-widest font-mono">
                                            SOULBOUND #9921
                                        </div>
                                        
                                        <div className="space-y-4">
                                            <div className="w-14 h-14 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center border border-emerald-500/20 shadow-inner">
                                                <Icons.Award />
                                            </div>
                                            <div>
                                                <h3 className="text-xl font-extrabold tracking-wider bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">DIPLOMA ACADÉMICO</h3>
                                                <p className="text-xs text-slate-400">Conservatorio Superior de Música de la EVM</p>
                                            </div>
                                        </div>

                                        <div className="space-y-3 my-6 font-mono text-xs bg-slate-950/80 p-4 rounded-2xl border border-slate-850/80">
                                            <p className="flex justify-between"><span className="text-slate-500">Graduado:</span> <span className="text-slate-200 font-bold">Valentino Lattanzi</span></p>
                                            <p className="flex justify-between items-center"><span className="text-slate-500">Wallet:</span> <span className="text-emerald-400 font-bold bg-emerald-950/40 px-1.5 py-0.5 rounded border border-emerald-900/30 text-[10px]">{walletAddress.substring(0, 16)}...</span></p>
                                            <p className="flex justify-between"><span className="text-slate-500">Materia Clave:</span> <span className="text-slate-300">Aprobadas {dbRecords.filter(r => r.approved && r.status === 'CONFIRMED').length} / 3</span></p>
                                            <p className="flex justify-between"><span className="text-slate-500">Estado:</span> <span className="text-emerald-400 font-bold flex items-center gap-1">✔ SBT ACTIVO E INTRANSFERIBLE</span></p>
                                        </div>

                                        <div className="text-[10px] text-slate-400 italic text-center border-t border-slate-850 pt-3">
                                            "Este diploma está anclado criptográficamente a la identidad del alumno."
                                        </div>
                                    </div>

                                    {/* PANEL DE AUDITORÍA FORENSE PÚBLICA */}
                                    <div className="glass rounded-2xl p-6 border border-slate-850 shadow-xl flex flex-col justify-between">
                                        <div className="space-y-4">
                                            <div className="flex items-center gap-2 text-emerald-400 border-b border-slate-800 pb-3">
                                                <Icons.Shield />
                                                <h3 className="font-bold">Escrutinio Público del Analítico</h3>
                                            </div>
                                            <p className="text-xs text-slate-400">
                                                Audita en tiempo real el historial académico resguardado en la blockchain de forma soberana.
                                            </p>

                                            <div className="space-y-2.5 max-h-[220px] overflow-y-auto">
                                                {dbRecords.map((r, idx) => (
                                                    <div key={idx} className="bg-slate-950 p-3 rounded-xl border border-slate-850/80 flex justify-between items-center text-xs">
                                                        <div>
                                                            <p className="font-bold text-slate-200">{r.subjectName}</p>
                                                            <p className="text-[10px] text-slate-500">Profesor ID: #{r.professorId} &middot; {r.date}</p>
                                                        </div>
                                                        <div className="text-right">
                                                            <span className={`font-mono font-bold text-sm px-2 py-0.5 rounded ${r.approved ? 'text-emerald-400 bg-emerald-500/5' : 'text-red-400 bg-red-500/5'}`}>
                                                                {r.score}
                                                            </span>
                                                            <p className="text-[9px] text-slate-500 font-mono mt-1">{r.status}</p>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="bg-slate-950/60 p-3 rounded-xl border border-slate-850 text-center text-xs text-slate-500 font-mono">
                                            Firmado por: 0xADMIN_CONSERVATORIO
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* ⚙️ CONSOLA ADMINISTRATIVA / CONGESTIÓN */}
                            {currentRole === 'admin' && (
                                <div className="glass rounded-2xl p-6 border border-slate-850 shadow-xl space-y-6">
                                    <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                                        <div className="flex items-center gap-2 text-rose-400">
                                            <Icons.Key />
                                            <h3 className="font-bold text-lg">Módulo de Recuperación y Contingencia</h3>
                                        </div>
                                        <span className="text-xs bg-rose-500/10 text-rose-400 border border-rose-500/20 px-2.5 py-1 rounded-full font-mono">
                                            Multisig Admin Panel
                                        </span>
                                    </div>

                                    <div className="bg-rose-950/20 border border-rose-900/40 p-4 rounded-xl text-xs space-y-2 text-rose-300">
                                        <p className="font-bold">🚨 SOLUCIÓN A LA VULNERABILIDAD SBT:</p>
                                        <p className="leading-relaxed">
                                            Si el estudiante pierde su wallet de egresado o se ve comprometida, un contrato estricto regular ordinario impediría la portabilidad académica. Este panel simula el protocolo de revocación institucional por el cual el administrador realiza una reemisión de su SBT a una wallet limpia.
                                        </p>
                                    </div>

                                    <form onSubmit={handleAdminReissue} className="space-y-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Dirección de la Nueva Wallet del Graduado</label>
                                            <input 
                                                type="text" 
                                                value={reissuedWallet}
                                                onChange={(e) => setReissuedWallet(e.target.value)}
                                                placeholder="Ej: 0xNuevaClaveLattanzi8888DDR5LianLiIII" 
                                                className="w-full bg-slate-950 border border-slate-850 rounded-xl px-4 py-3 text-sm text-slate-200 outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500 transition-all font-mono" 
                                                required
                                            />
                                        </div>

                                        <button 
                                            type="submit" 
                                            className="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-lg shadow-rose-600/15 flex justify-center items-center gap-2 text-xs uppercase tracking-wider"
                                        >
                                            Proceder con la Revocación y Reemisión de Emergencia
                                        </button>
                                    </form>

                                    <div className="bg-slate-950/40 p-4 rounded-xl border border-slate-850 space-y-2 text-xs">
                                        <span className="text-slate-400 font-semibold block">Historial de Cambios de Dirección:</span>
                                        <div className="font-mono text-[10px] space-y-1 text-slate-500">
                                            <p>&bull; 2026-05-22 09:00 - Registrada wallet de ingreso: <span className="text-indigo-400">0xValentino...77</span></p>
                                            {isSbtRevoked && (
                                                <p className="text-rose-400 animate-pulse">&bull; 2026-05-31 14:55 - REVOCACIÓN EJECUTADA. Nueva dirección asignada: <span className="text-emerald-400">{walletAddress}</span></p>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* 💻 CONSOLA DE LOGS INTEGRACIÓN HÍBRIDA (SPRING BOOT - WEB3J) */}
                            <div className="bg-slate-950 rounded-2xl border border-slate-900 shadow-inner overflow-hidden flex flex-col h-[200px]">
                                <div className="bg-slate-900/60 border-b border-slate-900 px-4 py-2 flex justify-between items-center text-[10px] uppercase font-bold tracking-wider text-slate-400 font-mono">
                                    <span>Servicio Backend: Spring Boot & Web3j Logs</span>
                                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                                </div>
                                <div ref={logConsoleRef} className="p-4 font-mono text-[11px] text-slate-300 space-y-1.5 overflow-y-auto flex-1 select-text">
                                    {springLogs.map((log, idx) => (
                                        <div key={idx} className={`${
                                            log.includes('REST') ? 'text-indigo-300' :
                                            log.includes('Captured') || log.includes('Event') ? 'text-emerald-300' :
                                            log.includes('ADMIN') || log.includes('REVOCACIÓN') ? 'text-rose-400' : 'text-slate-400'
                                        }`}>
                                            {log}
                                        </div>
                                    ))}
                                </div>
                            </div>

                        </div>

                        {/* COLUMNA DERECHA: LEDGER BLOCKCHAIN (VISUALIZACIÓN DE EVENTOS EN BLOCKCHAIN) */}
                        <div className="space-y-4">
                            <div className="flex justify-between items-center">
                                <h3 className="text-xs font-bold text-slate-400 tracking-wider uppercase flex items-center gap-2">
                                    <Icons.HardDrive /> Ledger Descentralizado
                                </h3>
                                <button onClick={clearHistory} className="text-[10px] text-slate-500 hover:text-slate-300 transition-colors">
                                    Limpiar Transacciones
                                </button>
                            </div>

                            <div className="space-y-3 max-h-[750px] overflow-y-auto pr-1">
                                {transactions.length === 0 ? (
                                    <div className="bg-slate-900/40 border border-slate-850 rounded-xl p-6 text-center text-xs text-slate-500">
                                        No hay transacciones registradas en este bloque de simulación local.
                                    </div>
                                ) : (
                                    transactions.map((tx) => (
                                        <div key={tx.id} className={`p-4 rounded-xl border transition-all duration-300 ${
                                            tx.status === 'CONFIRMED' 
                                                ? 'bg-slate-900/90 border-slate-850 hover:border-slate-800' 
                                                : 'bg-indigo-950/20 border-indigo-500/40 animate-pulse-fast'
                                        }`}>
                                            <div className="flex justify-between items-start mb-2">
                                                <span className={`text-[9px] font-bold px-2 py-0.5 rounded uppercase tracking-wider ${
                                                    tx.type === 'Carga de Nota' ? 'bg-indigo-500/10 text-indigo-400' : 
                                                    tx.type === 'Registro IP' ? 'bg-cyan-500/10 text-cyan-400' : 'bg-rose-500/10 text-rose-400'
                                                }`}>
                                                    {tx.type}
                                                </span>
                                                <div className="flex items-center gap-1.5 text-xs">
                                                    {tx.status === 'CONFIRMED' ? (
                                                        <span className="text-emerald-400 flex items-center gap-1 font-semibold text-[10px]">
                                                            <Icons.CheckCircle /> Bloque #{tx.block}
                                                        </span>
                                                    ) : (
                                                        <span className="text-indigo-400 flex items-center gap-1 font-semibold text-[10px] animate-pulse">
                                                            <Icons.Clock /> Procesando...
                                                        </span>
                                                    )}
                                                </div>
                                            </div>

                                            <p className="text-sm font-semibold text-slate-200 mb-1">{tx.detail}</p>
                                            <p className="text-[10px] text-slate-500 font-mono mb-2">Wallet: {walletAddress.substring(0, 16)}...</p>
                                            
                                            <div className="pt-2 border-t border-slate-850/60 flex justify-between items-center text-[10px] text-slate-500 font-mono">
                                                <span>EVM Hash:</span>
                                                <span className="text-indigo-300 bg-slate-950 px-1.5 py-0.5 rounded border border-slate-850 text-[10px]">
                                                    {tx.txHash}
                                                </span>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
